plugins {
	id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
	keystorePropertiesFile.load(new FileInputStream(keystorePropertiesFile))
}

android {
	compileSdk 34

	defaultConfig {
		applicationId "com.trust.acc.open"
		namespace "com.trust.acc"
		minSdk 26
		targetSdk 34
		versionCode 6
		versionName "1.4.0"
		vectorDrawables.useSupportLibrary = true
		buildConfigField "boolean", "ENABLE_SHEET_MUSIC", "true"
		buildConfigField "String", "SCORES_PACK_URL", "\"https://github.com/iamkuyik/A-Church-Companion/releases/latest\""
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	signingConfigs {
		release {
			if (keystorePropertiesFile.exists()) {
				storeFile file(keystoreProperties['storeFile'])
				storePassword keystoreProperties['storePassword']
				keyAlias keystoreProperties['keyAlias']
				keyPassword keystoreProperties['keyPassword']
			}
		}
	}

	buildTypes {
		release {
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			if (keystorePropertiesFile.exists()) {
				signingConfig signingConfigs.release
			}
		}
	}

	buildFeatures {
		viewBinding true
		buildConfig true
	}
}

dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar'])
	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'com.google.android.material:material:1.12.0'
	implementation 'com.google.code.gson:gson:2.11.0'
}
