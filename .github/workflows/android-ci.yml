name: Android CI & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish ACC Open v1.4.1 APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Signed Release & Debug APKs
        run: |
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ACC-Open-v1.4.1-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ACC-Open-v1.4.1-debug.apk
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ACC-Open-v1.4.1-apks
          path: |
            dist/ACC-Open-v1.4.1-release.apk
            dist/ACC-Open-v1.4.1-debug.apk
          if-no-files-found: error

      - name: Publish v1.4.1 GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.1
          name: "v1.4.1 — Fixed PDF Score Rendering & Split .acc Pack Support"
          draft: false
          prerelease: false
          body: |
            ## A Church Companion — Open Edition v1.4.1 (`com.trust.acc.open`, `versionCode 9`)

            ### ✦ Key Fixes
            - **Fixed blank musical score rendering:** Restored `Bitmap.Config.ARGB_8888` required by Android `PdfRenderer.Page.render()` (capped at 1800px + OOM fallback) and replaced `setImageBitmap(null)` with `setImageDrawable(null)` + 220dp loading placeholder in `PdfPageAdapter`.
            - **Split `.acc` Pack Support:** Seamlessly import separate text/Bible packs (`acc_hymns_and_bibles.acc`) and PDF sheet-music packs (`acc_musical_scores.acc`) independently or in any order with automatic alphabetical sorting and deduplication.

            ### 📦 Downloadable APKs
            - **`ACC-Open-v1.4.1-release.apk`** (`com.trust.acc.open` — installs side-by-side alongside `com.trust.acc`)
            - **`ACC-Open-v1.4.1-debug.apk`**
          files: |
            dist/ACC-Open-v1.4.1-release.apk
            dist/ACC-Open-v1.4.1-debug.apk
