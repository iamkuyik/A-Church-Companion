name: Android CI & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish ACC Open v1.4.0 APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Signed Release & Debug APKs
        run: |
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ACC-Open-v1.4.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ACC-Open-v1.4.0-debug.apk
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ACC-Open-v1.4.0-apks
          path: |
            dist/ACC-Open-v1.4.0-release.apk
            dist/ACC-Open-v1.4.0-debug.apk
          if-no-files-found: error

      - name: Publish v1.4.0 GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: "v1.4.0 — Open-Source Public Release of A Church Companion (ACC Open)"
          draft: false
          prerelease: false
          body: |
            ## A Church Companion — Open Edition v1.4.0 (`com.trust.acc.open`, `versionCode 7`)

            ### 📦 Downloadable APKs
            - **`ACC-Open-v1.4.0-release.apk` (`com.trust.acc.open`)**: R8-minified, resource-shrunk release APK. Uses package ID `com.trust.acc.open` so it can be installed **side-by-side** alongside the congregation edition (`com.trust.acc`).
            - **`ACC-Open-v1.4.0-debug.apk`**: Debug build for testing.

            ### ✦ Highlights
            - **Public-Domain Bilingual Holy Bible (`WITHOUT ROWID` SQLite)**: Efik (*Ŋwed Abasi*), King James Version (KJV), and Bible in Basic English (BBE) with Single & Parallel views.
            - **Public-Domain Starter Hymnals & Extensible `.acc` Importer**: Classic Christian hymns, traditional *Ŋwed Ikwọ* Efik hymns, manual hymn creation, and streaming `.acc` / `.json` pack import & export for congregation hymnals and zoomable PDF musical scores.
            - **Zero Network Permissions**: 100% offline-first with Sacred Editorial light/dark themes.
          files: |
            dist/ACC-Open-v1.4.0-release.apk
            dist/ACC-Open-v1.4.0-debug.apk
