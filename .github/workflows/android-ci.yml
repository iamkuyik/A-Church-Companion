name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Verify, Test & Build ACC Open
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify release tag is merged into main & matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(gh api "repos/${{ github.repository }}/compare/main...${{ github.sha }}" --jq '.status')
          echo "Tag commit ${{ github.sha }} vs main: $STATUS"
          if [ "$STATUS" != "identical" ] && [ "$STATUS" != "behind" ]; then
            echo "ERROR: Refusing to release tag ${{ github.ref_name }} — commit is not merged into main (status=$STATUS)."
            exit 1
          fi
          APP_VER=$(grep -E 'versionName[[:space:]]+"[^"]+"' app/build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$APP_VER" != "$TAG_VER" ]; then
            echo "ERROR: Tag ${GITHUB_REF_NAME} does not match app/build.gradle versionName \"$APP_VER\"."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Feature Guard & Unit Tests
        run: |
          python3 tools/verify_features.py
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Signed Release & Debug APKs
        run: |
          APP_VER=$(grep -E 'versionName[[:space:]]+"[^"]+"' app/build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ACC-Open-v${APP_VER}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ACC-Open-v${APP_VER}-debug.apk"
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ACC-Open-apks-${{ github.run_number }}
          path: |
            dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ACC Open ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*.apk
